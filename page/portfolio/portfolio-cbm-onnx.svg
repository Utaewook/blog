<svg xmlns="http://www.w3.org/2000/svg" width="760" height="276" viewBox="0 0 760 276" role="img" aria-label="변환 전에는 피처 그룹별 SVM 11개가 각자 점수를 낸다. 커스텀 컨버터로 변환한 뒤에는 입력 1개를 그래프 안에서 분기해 SVM 11개에 나눠 주고 결과를 결합해 출력 1개로 내는 ONNX 그래프 하나가 된다">
