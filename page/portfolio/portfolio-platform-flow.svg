<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="수집, 스케줄링, job 큐, 전처리 7단, 추론 요청, 결과 기록 모듈을 직접 개발했다. 수집은 오브젝트 스토리지와 RDB에 적재하고 스케줄링이 이를 읽어 job을 발급하며, 추론 요청은 Triton으로 간다. 결과 기록 뒤 다음 job 요청이 job 큐로 돌아간다">
<style>
svg {
  --surface: #ffffff; --surface-2: #f6f8f7;
  --fg: #18211e; --muted: #5a6661; --line: #cdd5d1; --stroke: #3f4b46;
  --accent: #0a7468; --accent-tint: #d9efeb; --on-accent: #ffffff;
  --warn: #c2410c; --warn-tint: #fbe2d4;
  --a-tint: #e2eaf8; --a-stroke: #4467ad;
  --b-tint: #ebe5f6; --b-stroke: #6a54a6;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
 svg {
  --surface: #171d1b; --surface-2: #1c2421;
  --fg: #e2e9e6; --muted: #9aa6a1; --line: #33403b; --stroke: #b3beb9;
  --accent: #3fc8b5; --accent-tint: #163632; --on-accent: #08201c;
  --warn: #f2905f; --warn-tint: #3b2117;
  --a-tint: #1b2840; --a-stroke: #86a6e2;
  --b-tint: #261f3b; --b-stroke: #ae9ae8;
 }
}
.bg { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.bx { fill: var(--surface); stroke: var(--stroke); stroke-width: 1.2; }
.bx-soft { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.bx-a { fill: var(--a-tint); stroke: var(--a-stroke); stroke-width: 1.2; }
.bx-b { fill: var(--b-tint); stroke: var(--b-stroke); stroke-width: 1.2; }
.bx-acc { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.6; }
.bx-warn { fill: var(--warn-tint); stroke: var(--warn); stroke-width: 1.2; stroke-dasharray: 4 3; }
.bx-dim { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.panel { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.zone { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
.band-a { fill: var(--a-tint); stroke: var(--a-stroke); stroke-width: 1; }
.band-b { fill: var(--b-tint); stroke: var(--b-stroke); stroke-width: 1; }
.band-acc { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
.band-m { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.tint-a { fill: var(--a-tint); }
.tint-b { fill: var(--b-tint); }
.ln { fill: none; stroke: var(--stroke); stroke-width: 1.3; }
.ln-m { fill: none; stroke: var(--muted); stroke-width: 1; }
.ln-acc { fill: none; stroke: var(--accent); stroke-width: 2.2; }
.ln-warn { fill: none; stroke: var(--warn); stroke-width: 1.6; stroke-dasharray: 5 4; }
.ln-warn-s { fill: none; stroke: var(--warn); stroke-width: 2; }
.dash { stroke-dasharray: 4 3; }
.t { fill: var(--fg); font-size: 12px; }
.t11 { fill: var(--fg); font-size: 11px; }
.tb { fill: var(--fg); font-size: 12.5px; font-weight: 600; }
.th { fill: var(--fg); font-size: 14px; font-weight: 700; }
.ts { fill: var(--muted); font-size: 10.5px; }
.ta { fill: var(--accent); font-size: 11px; font-weight: 600; }
.tba { fill: var(--accent); font-size: 12px; font-weight: 700; }
.tw { fill: var(--warn); font-size: 11px; font-weight: 600; }
.ton { fill: var(--on-accent); font-size: 10.5px; font-weight: 700; }
.tdim { fill: var(--muted); font-size: 11px; }
.hl { fill: var(--accent); font-weight: 600; }
.mono { font-family: Consolas, "D2Coding", Menlo, "Noto Sans Mono", monospace; }
.mk { fill: var(--stroke); }
.mk-acc { fill: var(--accent); }
.mk-warn { fill: var(--warn); }
.dot-a { fill: var(--accent); }
.dot-b { fill: var(--surface); stroke: var(--fg); stroke-width: 1.3; }
.dot-flip { fill: var(--warn); }
.dot-ghost { fill: none; stroke: var(--line); stroke-width: 1.2; }
.dot-early { fill: var(--surface); stroke: var(--muted); stroke-width: 1.3; }
.contour { fill: none; stroke: var(--line); stroke-width: 1; }
.frame { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.wedge { fill: var(--warn-tint); }
.pill-acc { fill: var(--accent); }
.badge { fill: var(--accent); }
.commit { fill: var(--surface); stroke: var(--stroke); stroke-width: 1.5; }
.commit-acc { fill: var(--accent); }
.hdr { fill: var(--line); }
.opt { fill: none; stroke: var(--fg); stroke-width: 1.5; }

.grid { stroke: var(--line); stroke-width: 1; }
.axis { stroke: var(--muted); stroke-width: 1; }
.series { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.out-zone { fill: var(--warn-tint); }
.med { stroke: var(--stroke); stroke-width: 2; }
.ln-w { fill: none; stroke: var(--warn); stroke-width: 2; }
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="249" rx="10"/>
<defs>
<marker id="bf-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="bf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-acc"/></marker>
<marker id="bf-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-warn"/></marker>
</defs>
<rect class="bx-acc" x="16" y="72" width="100" height="50" rx="6"/>
<text class="tb" x="66.0" y="94.0" text-anchor="middle">수집</text>
<text class="ts" x="66.0" y="108.0" text-anchor="middle">TCP 파싱</text>
<rect class="bx-acc" x="141" y="72" width="100" height="50" rx="6"/>
<text class="tb" x="191.0" y="94.0" text-anchor="middle">스케줄링</text>
<text class="ts" x="191.0" y="108.0" text-anchor="middle">job 발급</text>
<rect class="bx-acc" x="266" y="72" width="100" height="50" rx="6"/>
<text class="tb" x="316.0" y="94.0" text-anchor="middle">job 큐</text>
<text class="ts" x="316.0" y="108.0" text-anchor="middle">1건씩 전달</text>
<rect class="bx-acc" x="391" y="72" width="100" height="50" rx="6"/>
<text class="tb" x="441.0" y="101.0" text-anchor="middle">전처리 7단</text>
<rect class="bx-acc" x="516" y="72" width="100" height="50" rx="6"/>
<text class="tb" x="566.0" y="94.0" text-anchor="middle">추론 요청</text>
<text class="ts" x="566.0" y="108.0" text-anchor="middle">KServe v2</text>
<rect class="bx-acc" x="641" y="72" width="100" height="50" rx="6"/>
<text class="tb" x="691.0" y="101.0" text-anchor="middle">결과 기록</text>
<path class="ln" d="M241,97 H265" marker-end="url(#bf-f)"/>
<path class="ln" d="M366,97 H390" marker-end="url(#bf-f)"/>
<path class="ln" d="M491,97 H515" marker-end="url(#bf-f)"/>
<path class="ln" d="M616,97 H640" marker-end="url(#bf-f)"/>
<rect class="bx-dim" x="16" y="170" width="225" height="44" rx="6"/>
<text class="t" x="128.5" y="196.0" text-anchor="middle">오브젝트 스토리지 · RDB</text>
<path class="ln" d="M66,122 V169" marker-end="url(#bf-f)"/>
<path class="ln" d="M191,170 V123" marker-end="url(#bf-f)"/>
<rect class="bx-dim" x="516" y="170" width="100" height="44" rx="6"/>
<text class="t" x="566.0" y="196.0" text-anchor="middle">Triton</text>
<path class="ln" d="M566,122 V169" marker-end="url(#bf-f)"/>
<path class="ln-acc" d="M691,72 V44 H316 V71" marker-end="url(#bf-a)"/>
<text class="ta" x="503" y="36" text-anchor="middle">다음 job 요청</text>
<rect class="bx-acc" x="641" y="226" width="14" height="14" rx="3"/>
<text class="ts" x="661" y="237" text-anchor="start">직접 개발</text>
</svg>
