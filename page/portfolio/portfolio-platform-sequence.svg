<path class="ln" d="M432,104 H546" marker-end="url(#b1-f)"/>
<text class="t11" x="490" y="98" text-anchor="middle">기록</text>
<path class="ln-acc" d="M432,126 H460 V144 H433" marker-end="url(#b1-a)"/>
<text class="ta" x="468" y="140" text-anchor="start">합성 이벤트</text>
