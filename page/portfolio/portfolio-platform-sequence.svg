<rect class="bx" x="135" y="44" width="80" height="28" rx="6"/>
<text class="t" x="175.0" y="62.0" text-anchor="middle">저장소</text>
<line class="ln-m dash" x1="290" y1="72" x2="290" y2="248"/>
<rect class="bx" x="250" y="44" width="80" height="28" rx="6"/>
<text class="t" x="290.0" y="62.0" text-anchor="middle">전처리</text>
<path class="ln" d="M60,104 H289" marker-end="url(#b1-f)"/>
<text class="t11 mono" x="232" y="98" text-anchor="middle">job-ready</text>
<path class="ln" d="M290,140 H176" marker-end="url(#b1-f)"/>
<text class="t11" x="232" y="134" text-anchor="middle">조회</text>
<path class="ln-warn" d="M175,164 H289" marker-end="url(#b1-w)"/>
<text class="tw" x="232" y="158" text-anchor="middle">없음</text>
<path class="ln" d="M60,200 H174" marker-end="url(#b1-f)"/>
<text class="t11" x="118" y="194" text-anchor="middle">기록</text>
<path class="ln-m" d="M298,104 H304 V140 H298"/>
<text class="ts" x="309" y="126" text-anchor="start">+60~130ms</text>
<rect class="bx-warn" x="240" y="226" width="100" height="28" rx="6"/>
<text class="tw" x="290.0" y="244.0" text-anchor="middle">체인 정지</text>
<line class="ln-m dash" x1="432" y1="72" x2="432" y2="248"/>
<rect class="bx" x="392" y="44" width="80" height="28" rx="6"/>
<text class="t" x="432.0" y="62.0" text-anchor="middle">job 큐</text>
<line class="ln-m dash" x1="547" y1="72" x2="547" y2="248"/>
<rect class="bx" x="507" y="44" width="80" height="28" rx="6"/>
<text class="t" x="547.0" y="62.0" text-anchor="middle">저장소</text>
