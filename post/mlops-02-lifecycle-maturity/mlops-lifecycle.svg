<marker id="f21-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-acc"/></marker>
</defs>
<rect class="bx-a" x="16" y="14" width="14" height="14" rx="3"/><text class="ts" x="36" y="25">실험 (1–6)</text>
<rect class="bx-b" x="16" y="36" width="14" height="14" rx="3"/><text class="ts" x="36" y="47">운영 (7–8)</text>
