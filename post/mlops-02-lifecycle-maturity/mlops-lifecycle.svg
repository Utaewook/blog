<rect class="bx-a" x="274" y="63" width="112" height="34" rx="6"/><text class="t" x="330" y="84" text-anchor="middle">1. 데이터 추출</text>
<rect class="bx-a" x="426" y="107" width="112" height="34" rx="6"/><text class="t" x="482" y="128" text-anchor="middle">2. 데이터 분석</text>
<rect class="bx-a" x="489" y="213" width="112" height="34" rx="6"/><text class="t" x="545" y="234" text-anchor="middle">3. 데이터 준비</text>
<rect class="bx-a" x="426" y="319" width="112" height="34" rx="6"/><text class="t" x="482" y="340" text-anchor="middle">4. 모델 학습</text>
<rect class="bx-a" x="274" y="363" width="112" height="34" rx="6"/><text class="t" x="330" y="384" text-anchor="middle">5. 모델 평가</text>
<rect class="bx-a" x="122" y="319" width="112" height="34" rx="6"/><text class="t" x="178" y="340" text-anchor="middle">6. 모델 검증</text>
<rect class="bx-b" x="59" y="213" width="112" height="34" rx="6"/><text class="t" x="115" y="234" text-anchor="middle">7. 모델 서빙</text>
<rect class="bx-b" x="122" y="107" width="112" height="34" rx="6"/><text class="t" x="178" y="128" text-anchor="middle">8. 모델 모니터링</text>
